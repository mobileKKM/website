<div class="features">
    {% for feature in t.features %}
        {% if feature.title %}
            <div class="feature">
                <div>
                    <span class="icon">{% include icons/{{ feature.fontawesome_icon_name }}.svg %}</span>
                </div>
                <div class="featureText">
                    <h3>
                        {{ feature.title }}
                    </h3>
                    <p>
                        {{ feature.description }}
                    </p>
                </div>
            </div>
        {% endif %}
    {% endfor %}
</div>
