# Localization options
language: pl
timezone: Europe/Warsaw

# Site details (texts per language are in _data/i18n.yml)
url: https://mobilekkm.app
author: David Sn

# Includes an icon in the footer for each username you enter
footer-links:
  facebook: getmobilekkm
  instagram: getmobilekkm
  github: mobileKKM
  youtube: UC_5_qekQEXRLF_Pf-XLL7tQ
  email: mobilekkm@codebucket.de
  linkedin:
  linkedin-company:
  mastodon:            # full profile URL, e.g. https://mastodon.social/@name

# Enter your Disqus shortname (not your username) to enable commenting on posts
disqus:

# Enter your Google Analytics web tracking code (e.g. UA-2110908-2) to activate tracking
google_analytics:

# Jekyll 3 now only supports Kramdown for Markdown
kramdown:
  # Use GitHub flavored markdown, including triple backtick fenced code blocks
  input: GFM
  # Jekyll 3 and GitHub Pages now only support rouge for syntax highlighting
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    # Use existing pygments syntax highlighting css
    css_class: 'highlight'

# Set the Sass partials directory, as we're using @imports
sass:
  style: :compressed # You might prefer to minify using :compressed

# Exclude these files from your production _site
exclude:
  - Gemfile
  - vendor
  - Gemfile.lock
  - LICENSE
  - README.md
  - CNAME

# Plugins we want to use
plugins:
  - jekyll-sitemap

# Site collections
collections:
  pages:
    output: true
    permalink: /:path.html

# Page language: Polish by default, English under /en/
defaults:
  - scope:
      path: ""
    values:
      lang: pl
  - scope:
      path: "en"
    values:
      lang: en
  - scope:
      path: "_pages/en"
    values:
      lang: en
